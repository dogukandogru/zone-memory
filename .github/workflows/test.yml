# Testler her push ve her PR'da iki isletim sisteminde kosar.
#
# NEDEN WINDOWS DE VAR: uygulama Windows'a da paketleniyor ve bu depodaki
# hatalarin cogu yol/zaman farklarindan cikti (ters bolu, dosya kilitleri,
# saat dilimi). Yalnizca macOS'ta calisan bir testin bir sey kanitladigi yok.
#
# NEDEN NODE 20 VE 24: 20 desteklenen en eski surum (package.json engines),
# 24 gelistiricinin makinesindeki surum. Ikisi arasinda test kosucusunun
# dosya bulma davranisi bile degisti, bu yuzden ikisi de kosmak zorunda.
name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Bir kombinasyon patlayinca digerleri iptal olmasin: hatanin yalnizca
      # bir surumde mi yoksa her yerde mi oldugunu gormek gerekiyor.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    env:
      # Testler electron'u sahte modulle yukluyor, gercek ikiliye ihtiyac yok.
      # Indirme ~100 MB ve agdan dolayi kirilgan, bu yuzden atlaniyor.
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Bagimliliklari kur
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testler
        run: npm test
