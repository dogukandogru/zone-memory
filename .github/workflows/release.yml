# Surum yayinlama.
#
# Bir `v*` etiketi gonderildiginde gercek bir Windows makinesinde kurulum
# dosyasini uretir ve GitHub Releases'a yukler. Musterinin uygulamasi orayi
# kontrol edip guncellemeyi kendisi indirir.
#
# Kullanim:
#   npm version patch      (package.json surumunu artirir ve etiket atar)
#   git push --follow-tags
#
# NEDEN GERCEK WINDOWS: NSIS kurulum dosyasi macOS'ta wine ister. Burada
# gercek Windows kosucusu var, wine gerekmez.
#
# NEDEN VERISIZ: guncelleme paketlerinde mum deposu YOKTUR. Veri yalnizca ilk
# kurulumda, elden verilen pakette gider ve musterinin
# %APPDATA%\Zone Memory\data klasorunde durur; guncelleme oraya dokunmaz.
# Her guncellemede 300 MB indirmenin anlami olmazdi.

name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write        # Releases'a yukleyebilmek icin.

# AYNI ANDA TEK KOSU.
#
# Iki etiket birlikte gonderildiginde (v0.2.1 ve v0.2.2 ayni anda) iki kosu
# paralel calisti ve electron-builder ayni etiket icin IKI surum olusturdu:
# birinde latest.yml ve kurulum dosyasi, otekinde yalnizca blockmap. GitHub'in
# "en son surum" dedigi yer blockmap'i olan bos surume dustu, yani
# electron-updater latest.yml'i bulamayacak duruma geldi ve otomatik
# guncelleme sessizce kirilirdi.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # stamp-build `git describe` kullaniyor.

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Testler gecmeden surum cikmaz. Bozuk bir surumu musterinin
      # makinesine OTOMATIK indirtmek, elle vermekten cok daha kotudur.
      - run: npm test
      - run: npm run lint

      # Etiket ile package.json surumu tutmali. Tutmazsa electron-updater
      # yanlis surumu "yeni" sanip guncelleme dongusune girebilir.
      - name: Etiket ve surum ayni mi
        shell: bash
        run: |
          etiket="${GITHUB_REF_NAME#v}"
          surum=$(node -p "require('./package.json').version")
          if [ "$etiket" != "$surum" ]; then
            echo "Etiket ($etiket) ile package.json surumu ($surum) tutmuyor."
            echo "npm version ile artirip yeniden etiketleyin."
            exit 1
          fi
          echo "Surum $surum"

      # SURUMU ONCE BIZ OLUSTURUYORUZ.
      #
      # electron-builder her varligi ayri yukluyor ve surum henuz yoksa her
      # yukleme kendi surumunu olusturmaya calisiyor. Olculdu: ayni etiket
      # icin IKI surum cikti, birinde latest.yml ve kurulum dosyasi, otekinde
      # yalnizca blockmap. GitHub'in /releases/latest adresi ikisinden birine
      # dusuyor; bos olana dustugunde electron-updater latest.yml'i bulamaz
      # ve otomatik guncelleme sessizce kirilir. Surum onceden varsa
      # electron-builder onun icine yukler ve yaris olmaz.
      - name: Surumu olustur
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Surum zaten var, yeniden olusturulmuyor."
          else
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --notes "Otomatik yayin. Degisiklikler icin DEGISIKLIKLER.md dosyasina bakin."
          fi

      # ANAHTAR DEPO SIRRINDAN GELIR.
      #
      # Depo herkese acik (surumleri yayinlayabilmek icin boyle yapildi), bu
      # yuzden anahtar depoya YAZILAMAZ. Sir olarak durur ve yalnizca burada,
      # paketleme aninda dosyaya dokulur. Komut satiri yerine ortam degiskeni:
      # arguman kosucunun surec listesinde gorunur.
      #
      # DIKKAT: bu bir sir saklama yontemi DEGILDIR. Kurulum dosyasini eline
      # gecirenler anahtari cikarabilir. Amac yalnizca musterinin ve bizim
      # anahtari elle girmememiz. Deneme (practice) hesabi anahtari oldugu
      # icin yetkisi piyasa verisi okumakla sinirli.
      - name: Paketle ve yayinla
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZONE_MEMORY_OANDA_KEY: ${{ secrets.OANDA_API_KEY }}
        run: node scripts/prepare-dist.mjs --win --no-data --publish

      # Anahtar gercekten pakete girdi mi. Girmediyse musteri yine "API
      # anahtari gerekli" ekranini gorur ve bunu ancak o soyleyince ogreniriz.
      # Anahtarin KENDISI yazdirilmaz, yalnizca var/yok.
      - name: Gomulu anahtar dogrulamasi
        shell: bash
        run: |
          dosya=src/main/apiKeys.local.json
          if [ ! -f "$dosya" ]; then
            echo "HATA: $dosya yok, kurulum anahtarsiz cikti."
            echo "Depo sirri OANDA_API_KEY tanimli mi?"
            exit 1
          fi
          node -e '
            const a = require("./src/main/apiKeys.local.json")
            const k = typeof a.oanda === "string" ? a.oanda.trim() : ""
            if (!k) { console.error("HATA: oanda anahtari BOS."); process.exit(1) }
            console.log("oanda anahtari yerinde, " + k.length + " karakter")
          '

      # Yine de iki surum olustuysa erken yakala: bozuk bir yayin, musterinin
      # guncelleme alamamasi demek ve bunu ancak aylar sonra fark ederdik.
      - name: Tek surum ve latest.yml dogrulamasi
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          adet=$(gh api repos/${GITHUB_REPOSITORY}/releases --jq "[.[] | select(.tag_name==\"$GITHUB_REF_NAME\")] | length")
          if [ "$adet" != "1" ]; then
            echo "HATA: $GITHUB_REF_NAME etiketi icin $adet surum var, 1 olmali."
            exit 1
          fi
          son=$(gh api repos/${GITHUB_REPOSITORY}/releases/latest --jq '[.assets[].name] | join(",")')
          echo "En son surumdeki dosyalar: $son"
          case "$son" in
            *latest.yml*) echo "latest.yml yerinde." ;;
            *) echo "HATA: en son surumde latest.yml yok, otomatik guncelleme calismaz."; exit 1 ;;
          esac
